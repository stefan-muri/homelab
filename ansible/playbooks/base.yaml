---
- name: Base setup for the k3s nodes
  hosts: k3s
  become: true
  # Reboot one node at a time
  serial: 1

  tasks:
    - name: Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - kitty-terminfo
          - curl
          - nfs-common
        state: present
      tags: packages
    - name: Check whether an update needs a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if needed
      ansible.builtin.reboot:
      when: reboot_required.stat.exists
