apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
spec:
  backend:
    repoPasswordSecretRef:
      name: backup-repo
      key: repo-password
    rest:
      url: http://10.0.0.8:8000/k3s/
      userSecretRef:
        name: backup-repo
        key: rest-user
      passwordSecretReg:
        name: backup-repo
        key: rest-password
  backup:
    schedule: "0 3 * * *"
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
  prune:
    schedule: "30 4 * * 0"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
  check:
    schedule: "30 9 * * 0"
