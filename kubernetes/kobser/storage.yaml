apiVersion: v1
kind: PersistentVolume
metadata:
  name: kobser-music
spec:
  capacity:
    storage: 1Gi # required by the API, not enforced by NFS
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: kobser
    name: music
  mountOptions:
    - nfsvers=4.2
    - hard
  nfs:
    server: 10.0.0.8
    path: /home/srv/media/music
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music
  annotations:
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: kobser-music
  resources:
    requests:
      storage: 1Gi
---
# navidrome's database and artwork
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  annotations:
    # Deleting the Argo CD app must not delete the data with it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# kobser's database, on the node's local disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kobser-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
