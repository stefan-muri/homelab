apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kobser-lan
spec:
  parentRefs:
    - name: internal
      namespace: traefik
      sectionName: websecure
  hostnames:
    - music.k8s.unterhaken.at
  rules:
    - backendRefs:
        - name: kobser
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome-lan
spec:
  parentRefs:
    - name: internal
      namespace: traefik
      sectionName: websecure
  hostnames:
    - navidrome.k8s.unterhaken.at
  rules:
    - backendRefs:
        - name: navidrome
          port: 4533
