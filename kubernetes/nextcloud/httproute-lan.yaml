apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-lan
spec:
  parentRefs:
    - name: internal
      namespace: traefik
      sectionName: websecure
  hostnames:
    - cloud.k8s.unterhaken.at
  rules:
    - backendRefs:
        - name: nextcloud
          port: 80
