apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: public
  hostnames:
    - cloud.unterhaken.at
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=15552000
      backendRefs:
        - name: nextcloud
          port: 80
