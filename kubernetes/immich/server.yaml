apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k3s-tojo
      initContainers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          restartPolicy: Always
          args: ["--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
          startupProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.4
          env:
            - name: TZ
              value: Europe/Vienna
            - name: DB_HOSTNAME
              value: immich-db-rw
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: REDIS_HOSTNAME
              value: 127.0.0.1
          ports:
            - name: http
              containerPort: 2283
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: library
              mountPath: /data
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: library
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
