apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
spec:
  backend:
    repoPasswordSecretRef:
      name: backup-repo
      key: repo-password
    rest:
      url: http://10.0.0.8:8000/k3s/
      userSecretRef:
        name: backup-repo
        key: rest-user
      passwordSecretReg:
        name: backup-repo
        key: rest-password
  backup:
    schedule: "20 4 * * *"
  prune:
    schedule: "0 13 * * 0"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
  check:
    schedule: "30 13 * * 0"
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: immich-db
spec:
  backupCommand: pg_dump --clean --if-exists --no-owner
  fileExtension: .sql
  pod:
    spec:
      containers:
        - name: pgdump
          image: ghcr.io/tensorchord/cloudnative-vectorchord:17.5-0.4.3
          command: ["sleep", "infinity"]
          env:
            - name: PGHOST
              value: immich-db-rw
            - name: PGDATABASE
              value: immich
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
