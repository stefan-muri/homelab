dex:
  enabled: false
global:
  domain: argocd.k8s.unterhaken.at
configs:
  params:
    server.insecure: true

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  httproute:
    enabled: true
    parentRefs:
      - name: internal
        namespace: traefik
        sectionName: websecure
    hostnames:
      - argocd.k8s.unterhaken.at
