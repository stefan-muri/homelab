dex:
  enabled: false
global:
  domain: argocd.k8s.unterhaken.at
configs:
  params:
    server.insecure: true

controller:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - k3s-mojo
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k3s-tojo
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1536Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  httproute:
    enabled: true
    parentRefs:
      - name: internal
        namespace: traefik
        sectionName: websecure
    hostnames:
      - argocd.k8s.unterhaken.at
