# www redirects to the apex. https is hardcoded because TLS ends at Cloudflare.
server {
    listen 8080;
    server_name www.daelite.at;
    return 301 https://daelite.at$request_uri;
}

server {
    listen 8080 default_server;
    server_name daelite.at;

    root /git/site;
    index index.html;

    # Relative Location headers. Otherwise nginx adds :8080 to its own redirects.
    absolute_redirect off;

    # The web root is a git checkout.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location = /README.md {
        deny all;
    }

    # Only expires in location blocks. An add_header here would drop the
    # server-level headers below.
    location ~* \.(woff2|svg|webp|jpg|jpeg|png|ico|mp4)$ {
        expires 7d;
    }

    location ~* \.(html|xml|txt|json)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
