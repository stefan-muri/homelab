apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      enableServiceLinks: false
      initContainers:
        - name: broker
          image: valkey/valkey:9.1.2-alpine
          restartPolicy: Always
          args: ["--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
          startupProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.3.3
          env:
            - name: PAPERLESS_REDIS
              value: redis://localhost:6379
            - name: PAPERLESS_DBENGINE
              value: sqlite
            - name: PAPERLESS_URL
              value: https://docs.unterhaken.at
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: https://docs.k8s.unterhaken.at
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-env
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Vienna
            - name: PAPERLESS_OCR_LANGUAGE
              value: deu+eng+ron
            - name: PAPERLESS_OCR_LANGUAGES
              value: ron
            - name: PAPERLESS_DATE_PARSER_LANGUAGES
              value: de+en+ro
            - name: PAPERLESS_IGNORE_DATES
              valueFrom:
                secretKeyRef:
                  name: paperless-env
                  key: PAPERLESS_IGNORE_DATES
            - name: PAPERLESS_FILENAME_FORMAT
              value: "{{ created_year }}/{{ document_type }}/{{ created_year }}-{{ created_month }}-{{ created_day }} {{ title }}"
            - name: PAPERLESS_FILENAME_FORMAT_REMOVE_NONE
              value: "true"
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
          ports:
            - name: http
              containerPort: 8000
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
        - name: ftp
          image: stilliard/pure-ftpd:trixie-1.0.50
          env:
            - name: PUBLICHOST
              value: 10.0.0.46
            - name: FTP_USER_NAME
              value: scanner
            - name: FTP_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: paperless-env
                  key: PAPERLESS_FTP_PASSWORD
            - name: FTP_USER_HOME
              value: /home/scanner
            - name: FTP_USER_UID
              value: "1000"
            - name: FTP_USER_GID
              value: "1000"
          ports:
            - name: ftp
              containerPort: 21
          readinessProbe:
            tcpSocket:
              port: ftp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: consume
              mountPath: /home/scanner
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: consume
          persistentVolumeClaim:
            claimName: consume
