apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: integrac-db
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
  # A PDB on the only instance would block every node drain.
  enablePDB: false
  bootstrap:
    initdb:
      database: integrac
      owner: integrac
      secret:
        name: integrac-db
  storage:
    storageClass: local-path
    size: 5Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: k3s-dojo
  inheritedMetadata:
    annotations:
      k8up.io/backup: "false"
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: integrac-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: integrac-db
  podMetricsEndpoints:
    - port: metrics
