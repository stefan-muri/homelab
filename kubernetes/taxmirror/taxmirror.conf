# No access log: TaxMirror's privacy page says the server keeps no record of
# visits. Change both together. Traefik's access log is off as well (chart default).
access_log off;

# www redirects to the apex. https is hardcoded because TLS ends at Cloudflare.
server {
    listen 8080;
    server_name www.taxmirror.eu;
    return 301 https://taxmirror.eu$request_uri;
}

server {
    listen 8080 default_server;
    server_name taxmirror.eu;

    root /git/site;
    index index.html;
    absolute_redirect off;

    # Expo exports /en/calculator as en/calculator.html and /en as en/index.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        expires -1;
    }
    error_page 404 /404.html;

    # Content-hashed file names: cache for a year.
    # add_header, not expires: expires would add a second Cache-Control.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/headers.inc;
    }
    location ~ ^/tm-kernel-[0-9a-f]+\.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/headers.inc;
    }
    location /assets/ {
        expires 7d;
    }

    # The web root is a git checkout.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    # Expo's development route list and the router's raw not-found page.
    location ~ ^/(_sitemap|\+not-found)(\.html)?$ {
        return 404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/xml text/plain;

    include /etc/nginx/conf.d/headers.inc;
}
