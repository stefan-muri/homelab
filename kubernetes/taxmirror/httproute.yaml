apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taxmirror
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: public
  hostnames:
    - taxmirror.eu
    - www.taxmirror.eu
  rules:
    - backendRefs:
        - name: taxmirror
          port: 80
