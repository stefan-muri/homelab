apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
spec:
  backend:
    repoPasswordSecretRef:
      name: backup-repo
      key: repo-password
    rest:
      url: http://10.0.0.8:8000/k3s/
      userSecretRef:
        name: backup-repo
        key: rest-user
      passwordSecretReg:
        name: backup-repo
        key: rest-password
  backup:
    schedule: "20 3 * * *"
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
  prune:
    schedule: "0 5 * * 0"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
  check:
    schedule: "0 6 * * 0"
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: jellyfin-db
spec:
  backupCommand: sqlite3 /config/data/data/jellyfin.db .dump
  fileExtension: .sql
  pod:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: sqlite
          image: keinos/sqlite3:3.54.1
          args: ["sleep", "infinity"]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
