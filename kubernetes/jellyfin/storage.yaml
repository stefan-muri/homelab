apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
spec:
  capacity:
    storage: 1Gi # required by the API, not enforced by NFS
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: jellyfin
    name: media
  mountOptions:
    - nfsvers=4.2
    - hard
  nfs:
    server: 10.0.0.8
    path: /home/srv/media
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  annotations:
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: jellyfin-media
  resources:
    requests:
      storage: 1Gi
---
# Settings, database and metadata
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
# Image cache rebuilt by Jellyfin
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache
  annotations:
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
