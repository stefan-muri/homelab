apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent-lan
spec:
  parentRefs:
    - name: internal
      namespace: traefik
      sectionName: websecure
  hostnames:
    - torrent.k8s.unterhaken.at
  rules:
    - backendRefs:
        - name: qbittorrent
          port: 80
