apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      serviceAccountName: glance
      containers:
        - name: glance
          image: glanceapp/glance:v0.8.7
          env:
            - name: TZ
              value: Europe/Vienna
            - name: KUBE_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/var/run/secrets/kubernetes.io/serviceaccount
          envFrom:
            - secretRef:
                name: glance-env
          ports:
            - name: http
              containerPort: 8080
          # Traefik needs a moment to stop routing to a terminating pod.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: glance-config
