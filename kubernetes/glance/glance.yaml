pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: server-stats
            servers:
              - type: remote
                name: dojo
                url: http://10.0.0.7:27973
                token: ${GLANCE_AGENT_TOKEN}
              - type: remote
                name: tojo
                url: http://10.0.0.8:27973
                token: ${GLANCE_AGENT_TOKEN}
              - type: remote
                name: mojo
                url: http://10.0.0.9:27973
                token: ${GLANCE_AGENT_TOKEN}

          - type: weather
            location: Vienna, Austria
            units: metric
            hour-format: 24h

          - type: calendar
            first-day-of-week: sunday

          - type: dns-stats
            service: pihole-v6
            url: http://10.0.0.11:8888
            password: ${PIHOLE_APP_PASSWORD}

          - type: rss
            limit: 10
            collapse-after: 3
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://ciechanow.ski/atom.xml
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://samwho.dev/rss.xml
              - url: https://ishadeed.com/feed.xml
                title: Ahmad Shadeed

      - size: full
        widgets:
          # url is the public hostname where one exists, so a tile works from
          # outside the LAN. check-url is the internal address, so the status
          # reflects the service and not the tunnel.
          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Immich
                url: https://photos.unterhaken.at
                check-url: http://10.0.0.20:2283
                icon: si:immich
              - title: Jellyfin
                url: https://jellyfin.unterhaken.at
                check-url: http://10.0.0.21:8096
                icon: si:jellyfin
                alt-status-codes: [302]
              - title: NextCloud
                url: https://cloud.unterhaken.at
                check-url: https://10.0.0.22:4444
                icon: si:nextcloud
                allow-insecure: true
                alt-status-codes: [302]
              - title: Nextcloud (Integrac)
                url: https://integrac.unterhaken.at
                # status.php answers 200 directly; / redirects to an https URL
                # on a port that only speaks http.
                check-url: http://10.0.0.23:4444/status.php
                icon: si:nextcloud
              - title: Navidrome
                url: http://10.0.0.22:4533
                icon: si:navidrome
                alt-status-codes: [302]
              - title: qBittorrent
                url: https://torrent.unterhaken.at
                check-url: http://10.0.0.21:8081
                icon: si:qbittorrent
              - title: File Browser
                url: https://files.unterhaken.at
                check-url: http://10.0.0.22:8080
                icon: sh:file-browser-light
              - title: Vaultwarden
                url: https://vaultwarden.unterhaken.at
                check-url: http://10.0.0.12:8081
                icon: si:vaultwarden
              - title: Paperless
                url: https://docs.unterhaken.at
                check-url: http://10.0.0.14:8000
                icon: si:paperlessngx
                alt-status-codes: [302]
              - title: Gitea
                url: https://git.unterhaken.at
                check-url: http://10.0.0.10:3030
                icon: si:gitea
              - title: Portainer
                url: http://10.0.0.10:9000
                icon: si:portainer
              - title: Pi-Hole
                url: http://10.0.0.11:8888/admin/login
                icon: si:pihole
              - title: Kavita
                url: https://books.unterhaken.at
                check-url: http://10.0.0.21:5000
                icon: sh:kavita-light
              - title: Argo CD
                url: https://argocd.k8s.unterhaken.at
                icon: si:argo
              # No icon available past this point.
              - title: Kobser
                url: https://music.unterhaken.at
                check-url: http://10.0.0.22:4633
              - title: DA ELITE
                url: https://daelite.at
                check-url: http://daelite.daelite.svc.cluster.local
              - title: TaxMirror
                url: https://taxmirror.eu
                check-url: http://taxmirror.taxmirror.svc.cluster.local

          - type: group
            widgets:
              - type: hacker-news
              - type: lobsters

          - type: group
            widgets:
              - type: reddit
                subreddit: technology
                show-thumbnails: true
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true
