apiVersion: v1
kind: ServiceAccount
metadata:
  name: glance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glance
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["plndr-cp-lock", "plndr-svcs-lock"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glance
subjects:
  - kind: ServiceAccount
    name: glance
    namespace: glance
