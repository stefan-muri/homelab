apiVersion: v1
kind: ServiceAccount
metadata:
  name: glance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glance-list-argocd-apps
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glance-list-argocd-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glance-list-argocd-apps
subjects:
  - kind: ServiceAccount
    name: glance
    namespace: glance
