apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: glance
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - httproute-lan.yaml
  - sealedsecret-glance-env.yaml
configMapGenerator:
  - name: glance-config
    files:
      - glance.yml=glance.yaml
