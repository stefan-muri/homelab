# k3s runs these inside its own process, with their metrics on 127.0.0.1 only.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheusOperator:
  admissionWebhooks:
    # One certificate from cert-manager instead of a hook Job that Argo CD
    # would run again on every sync.
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus:
  prometheusSpec:
    # ServiceMonitors and rules from every namespace, not only this chart's.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 8GB
    nodeSelector:
      kubernetes.io/hostname: k3s-dojo
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

alertmanager:
  config:
    route:
      group_by: [alertname, namespace]
      receiver: telegram
      routes:
        - receiver: healthchecks
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        - receiver: "null"
          matchers:
            - severity =~ "info|none"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-notify/telegram-token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-notify/telegram-chat-id
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/watchdog-url
            send_resolved: false
  alertmanagerSpec:
    secrets:
      - alertmanager-notify
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana-admin
  defaultDashboardsTimezone: Europe/Vienna
  grafana.ini:
    server:
      root_url: https://grafana.k8s.unterhaken.at
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
  nodeSelector:
    kubernetes.io/hostname: k3s-dojo
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 384Mi
