# k3s runs these inside its own process, with their metrics on 127.0.0.1 only.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# The same process also serves the API server's metrics on every endpoint, so
# the kubelet repeats them and the API server adds histograms nothing here uses.
# The first rule in each list is the chart's default: setting a list replaces it.
kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd|scheduler|workqueue|authentication|authorization|aggregator|apiextensions|watch_cache|field_validation|serviceaccount|node_authorizer|cardinality_enforcement|admission_quota_controller)_.*
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: apiserver_(watch_.*|storage_list_duration_seconds|request_body_size_bytes|response_sizes)_bucket|etcd_request_duration_seconds_bucket|scheduler_.*_bucket

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheusOperator:
  admissionWebhooks:
    # One certificate from cert-manager instead of a hook Job that Argo CD
    # would run again on every sync.
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus:
  prometheusSpec:
    # ServiceMonitors and rules from every namespace, not only this chart's.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 8GB
    nodeSelector:
      kubernetes.io/hostname: k3s-dojo
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

alertmanager:
  config:
    route:
      group_by: [alertname, namespace]
      receiver: telegram
      routes:
        - receiver: healthchecks
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        - receiver: "null"
          matchers:
            - severity =~ "info|none"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-notify/telegram-token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-notify/telegram-chat-id
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/watchdog-url
            send_resolved: false
  alertmanagerSpec:
    secrets:
      - alertmanager-notify
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  testFramework:
    enabled: false
  sidecar:
    datasources:
      initDatasources: true
  admin:
    existingSecret: grafana-admin
  defaultDashboardsTimezone: Europe/Vienna
  grafana.ini:
    server:
      root_url: https://grafana.k8s.unterhaken.at
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
  nodeSelector:
    kubernetes.io/hostname: k3s-dojo
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 512Mi
