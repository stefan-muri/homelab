apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backups
spec:
  groups:
    - name: backups
      rules:
        - alert: K8upJobFailed
          # The chart has no honorLabels setting, so the job's namespace arrives as exported_namespace.
          expr: |
            sum by (namespace, jobType) (
              label_replace(increase(k8up_jobs_failed_counter[1h]), "namespace", "$1", "exported_namespace", "(.+)")
            ) > 0
          labels:
            severity: critical
          annotations:
            summary: A k8up {{ $labels.jobType }} job in {{ $labels.namespace }} failed.
        - alert: K8upBackupMissing
          # Jobs owned by a Backup, except the one that only runs the database dump.
          expr: |
            time() - max by (namespace) (
              kube_job_status_completion_time
              * on (namespace, job_name)
              kube_job_owner{owner_kind="Backup", job_name!~".+-prebackup"}
            ) > 26 * 3600
          labels:
            severity: critical
          annotations:
            summary: The last backup in {{ $labels.namespace }} finished {{ $value | humanizeDuration }} ago.
