apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Homelab
data:
  homelab.json: |
    {
      "uid": "homelab",
      "title": "Homelab",
      "description": "Cluster, databases, storage, backups and logs at a glance.",
      "tags": [
        "homelab"
      ],
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5m",
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "links": [
        {
          "title": "Kubernetes",
          "type": "dashboards",
          "tags": [
            "kubernetes-mixin"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "icon": "external link",
          "targetBlank": false
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 2,
            "refresh": 1,
            "options": []
          },
          {
            "name": "loki",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 2,
            "refresh": 1,
            "options": []
          },
          {
            "name": "namespace",
            "label": "Logs namespace",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${loki}"
            },
            "query": "label_values(namespace)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1,
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Status",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Nodes not ready",
          "description": "Kubernetes nodes whose Ready condition is not true.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(kube_node_info) - sum(kube_node_status_condition{condition=\"Ready\", status=\"true\"})",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods not ready",
          "description": "Pods that are not ready, without completed Job pods.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(count((kube_pod_status_ready{condition=\"true\"} == 0) unless on (namespace, pod) (kube_pod_status_phase{phase=\"Succeeded\"} == 1)) or vector(0)) and on () (count(kube_pod_info) > 0)",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Firing alerts",
          "description": "Alerts that Alertmanager sends to Telegram.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(ALERTS{alertstate=\"firing\", severity!~\"none|info\"}) or vector(0)",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Argo CD apps not OK",
          "description": "Applications that are out of sync or not healthy.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(count(argocd_app_info{sync_status!=\"Synced\"} or argocd_app_info{health_status!=\"Healthy\"}) or vector(0)) and on () (count(argocd_app_info) > 0)",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Backups overdue",
          "description": "Namespaces whose last k8up backup, volumes or SQL dump, finished more than 26 hours ago.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(count((time() - min by (namespace) (\n  max by (namespace, kind) (\n    label_replace(\n      label_replace(\n        kube_job_status_completion_time\n        * on (namespace, job_name) group_left ()\n        kube_job_owner{owner_kind=\"Backup\"},\n        \"kind\", \"volumes\", \"job_name\", \".*\"\n      ),\n      \"kind\", \"dump\", \"job_name\", \".+-prebackup\"\n    )\n  )\n)) > 26 * 3600) or vector(0)) and on () (count(kube_job_owner{owner_kind=\"Backup\"}) > 0)",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "DB replicas down",
          "description": "PostgreSQL clusters without a streaming replica.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(count(max by (namespace) (cnpg_pg_replication_streaming_replicas) < 1) or vector(0)) and on () (count(cnpg_pg_replication_streaming_replicas) > 0)",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Volumes not healthy",
          "description": "Longhorn volumes that are degraded or faulted.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(count(longhorn_volume_robustness{state=~\"degraded|faulted\"} == 1) or vector(0)) and on () (count(longhorn_volume_robustness) > 0)",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "TLS certificate",
          "description": "Days until the next certificate expires. cert-manager renews 30 days before.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(certmanager_certificate_expiration_timestamp_seconds - time()) / 86400",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "green",
                    "value": 25
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 10,
          "type": "row",
          "title": "Nodes",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "CPU",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval]))) * on (instance) group_left (nodename) node_uname_info",
              "refId": "A",
              "legendFormat": "{{nodename}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 12,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": [],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Memory",
          "description": "Memory in use, page cache not counted.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 6,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * on (instance) group_left (nodename) node_uname_info",
              "refId": "A",
              "legendFormat": "{{nodename}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 12,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": [],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Network",
          "description": "Received above the axis, sent below.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (nodename) (rate(node_network_receive_bytes_total{device=~\"eth.*|ens.*|enp.*\"}[$__rate_interval]) * on (instance) group_left (nodename) node_uname_info)",
              "refId": "A",
              "legendFormat": "{{nodename}} in",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "-sum by (nodename) (rate(node_network_transmit_bytes_total{device=~\"eth.*|ens.*|enp.*\"}[$__rate_interval]) * on (instance) group_left (nodename) node_uname_info)",
              "refId": "B",
              "legendFormat": "{{nodename}} out",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 12,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": [],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "type": "bargauge",
          "title": "Disks",
          "description": "Root disk and the Longhorn disk of each VM.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(1 - node_filesystem_avail_bytes{mountpoint=~\"/|/var/lib/longhorn\", fstype=\"ext4\"} / node_filesystem_size_bytes{mountpoint=~\"/|/var/lib/longhorn\", fstype=\"ext4\"}) * on (instance) group_left (nodename) node_uname_info",
              "refId": "A",
              "legendFormat": "{{nodename}} {{mountpoint}}",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.75
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "valueMode": "color",
            "namePlacement": "left",
            "showUnfilled": true,
            "sizing": "auto",
            "minVizHeight": 10,
            "maxVizHeight": 24,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 15,
          "type": "row",
          "title": "Applications",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Memory by namespace",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 9,
            "x": 0,
            "y": 15
          },
          "targets": [
