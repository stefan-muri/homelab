apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nodes
spec:
  groups:
    - name: nodes
      rules:
        - alert: NodeNotReady
          # The chart's KubeNodeNotReady waits 15 minutes.
          expr: max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Node {{ $labels.node }} has not been Ready for 2 minutes.
