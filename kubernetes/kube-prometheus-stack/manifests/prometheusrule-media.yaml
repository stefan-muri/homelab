apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: media
spec:
  groups:
    - name: media
      rules:
        - alert: MediaDiskLow
          # Every NFS volume from tojo reports the same filesystem, its /home.
          expr: min(kubelet_volume_stats_available_bytes{namespace="jellyfin", persistentvolumeclaim="media"}) < 50 * 1024 * 1024 * 1024
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: The media disk on tojo has {{ $value | humanize1024 }}B free.
