apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: internal
      namespace: traefik
      sectionName: websecure
  hostnames:
    - grafana.k8s.unterhaken.at
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
