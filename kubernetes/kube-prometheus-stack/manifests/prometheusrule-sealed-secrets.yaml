apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sealed-secrets
spec:
  groups:
    - name: sealed-secrets
      rules:
        - alert: SealedSecretNotSynced
          expr: sealed_secrets_controller_condition_info{condition="Synced"} != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: SealedSecret {{ $labels.namespace }}/{{ $labels.name }} could not be unsealed.
