apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hosts
spec:
  groups:
    - name: hosts
      rules:
        - alert: FilesystemUsageHigh
          # The chart's filesystem alerts fire only near 5% free or when a disk fills within a day.
          expr: |
            100 * (1 - node_filesystem_avail_bytes{job="node-exporter", fstype=~"ext4|xfs"}
              / node_filesystem_size_bytes{job="node-exporter", fstype=~"ext4|xfs"}) > 85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full."
        - alert: ZfsPoolUsageHigh
          # The k3s VM disks on these pools are thin and add up to more than the pool.
          expr: 100 * zfs_pool_allocated_bytes / zfs_pool_size_bytes > 80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full."
        - alert: ZfsPoolUnhealthy
          expr: zfs_pool_healthy == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is {{ $labels.health }}."
        - alert: ZfsPoolMetricsStale
          expr: time() - node_textfile_mtime_seconds{file=~".*zfs_pool.prom"} > 1800
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The ZFS pool metrics on {{ $labels.instance }} are more than 30 minutes old."
