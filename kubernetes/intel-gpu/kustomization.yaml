apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: intel-gpu
resources:
  - https://github.com/intel/intel-device-plugins-for-kubernetes/deployments/gpu_plugin?ref=v0.37.1
patches:
  # Only k3s-tojo has a GPU (GVT-g, see opentofu/main.tf).
  - target:
      kind: DaemonSet
      name: intel-gpu-plugin
    patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-tojo
