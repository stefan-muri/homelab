crds:
  enabled: true

prometheus:
  servicemonitor:
    enabled: true
    # Keep the certificate's namespace instead of renaming it to exported_namespace.
    honorLabels: true

resources:
  requests:
    memory: 128Mi

cainjector:
  resources:
    requests:
      memory: 128Mi

webhook:
  resources:
    requests:
      memory: 96Mi
