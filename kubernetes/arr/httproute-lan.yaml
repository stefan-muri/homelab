apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr-lan
spec:
  parentRefs:
    - name: internal
      namespace: traefik
      sectionName: websecure
  hostnames:
    - prowlarr.k8s.unterhaken.at
  rules:
    - backendRefs:
        - name: prowlarr
          port: 80
---
