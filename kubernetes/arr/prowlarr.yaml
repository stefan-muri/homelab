apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-tojo
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:3.1.0.5799-ls170
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Vienna
          ports:
            - name: http
              containerPort: 9696
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Allowed Hosts in the app's settings rejects requests to the pod IP.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
spec:
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 80
      targetPort: http
