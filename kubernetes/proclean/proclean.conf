# No access log: the Datenschutzerklärung says the web server keeps no record
# of visits. Change both together. Traefik's access log is off as well (chart default).
access_log off;

# The apex redirects to www, the canonical host in the site's canonical tags
# and sitemap. https is hardcoded because TLS ends at Cloudflare.
server {
    listen 8080;
    server_name procleangmbh.at;
    return 301 https://www.procleangmbh.at$request_uri;
}

# default_server, so the glance check on the service name gets 200.
server {
    listen 8080 default_server;
    server_name www.procleangmbh.at;

    root /git/site;
    index index.html;

    # Relative Location headers. Otherwise nginx adds :8080 to its own redirects.
    absolute_redirect off;

    # The web root is a git checkout. README.md and PROMPT.md are internal notes.
    # return, not deny: deny writes the request to the error log.
    location ~ /\. {
        return 404;
    }
    location ~* \.md$ {
        return 404;
    }

    # Only expires in location blocks. An add_header here would drop the
    # server-level headers below.
    location ~* \.(woff2|svg|jpg|jpeg|png|ico)$ {
        expires 7d;
    }

    location ~* \.(html|xml|txt)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
