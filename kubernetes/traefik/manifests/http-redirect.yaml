apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: traefik
spec:
  parentRefs:
    - name: internal
      sectionName: web
  hostnames:
    - "*.k8s.unterhaken.at"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
