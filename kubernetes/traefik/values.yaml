deployment:
  replicas: 2

providers:
  kubernetesGateway:
    enabled: true

service:
  annotations:
    kube-vip.io/loadbalancerIPs: "10.0.0.45"
  additionalServices:
    public:
      spec:
        type: ClusterIP

ports:
  public:
    port: 8001
    exposedPort: 80
    expose:
      default: false
      public: true

gateway:
  name: internal
  listeners:
    websecure:
      port: 8443
      protocol: HTTPS
      hostname: "*.k8s.unterhaken.at"
      namespacePolicy:
        from: All
      certificateRefs:
        - name: wildcard-k8s-unterhaken-at-tls
