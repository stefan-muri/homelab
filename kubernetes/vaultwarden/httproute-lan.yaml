apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-lan
spec:
  parentRefs:
    - name: internal
      namespace: traefik
      sectionName: websecure
  hostnames:
    - vaultwarden.k8s.unterhaken.at
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 80
