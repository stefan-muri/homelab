# The books on tojo over NFS, exported by murisato (roles/nfs_server).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kavita-books
spec:
  capacity:
    storage: 1Gi # required by the API, not enforced by NFS
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: kavita
    name: books
  mountOptions:
    - nfsvers=4.2
    - hard
  nfs:
    server: 10.0.0.8
    path: /home/srv/media/books
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: books
  annotations:
  # The books themselves are not backed up: replaceable, and on tojo already.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: kavita-books
  resources:
    requests:
      storage: 1Gi
---
# Config and SQLite database, on the node's local disk. Never on NFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  annotations:
    # Deleting the Argo CD app must not delete the data with it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
